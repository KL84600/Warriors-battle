<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hollow Knight Duel</title>
<style>
:root{--bg:#e9e6e1;--fg:#1d1b19;--mut:#5d5851;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d0f;--fg:#e8e3da;--mut:#9a948a}}
:root[data-theme="dark"]{--bg:#0e0d0f;--fg:#e8e3da;--mut:#9a948a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;display:flex;flex-direction:column;align-items:center;padding:12px}
canvas{width:100%;max-width:960px;height:auto;aspect-ratio:16/9;background:#000;border-radius:6px;display:block}
.keys{max-width:960px;width:100%;margin-top:10px;font-size:14px;line-height:1.6;color:var(--mut);text-align:center}
.keys b{color:var(--fg);font-weight:600}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div class="keys"><b>A/D</b> move · <b>W</b> jump · <b>Space</b> attack · <b>Q</b> roll (brief invincibility) · <b>F</b> parry, then hold to guard · <b>E</b> spirit slash (charges as you deal damage) · <b>P</b> pause<br>White glow = parry it. Red glow = dodge it (roll through or jump). Keyboard required.</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=960,H=540,G=460,WW=2400;
const keys={},press={};
addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();if(!keys[e.code])press[e.code]=1;keys[e.code]=1});
addEventListener('keyup',e=>keys[e.code]=0);
const k=(...a)=>a.some(c=>keys[c]),pr=(...a)=>a.some(c=>press[c]);
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
let AC;function snd(f,d,ty='square',v=.08){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}

const PMAX=320,SMAX=140;
const A={
 slam:{c:'w',dmg:30,hits:[{a:.85,d:.15,r:150}],tot:1.7,wa:-.15,ha:2.35},
 sweep:{c:'r',dmg:30,hits:[{a:.8,d:.22,r:215,low:1}],tot:1.7,wa:-1.6,ha:-4.33,ia:-3.78},
 combo:{c:'w',dmg:22,hits:[{a:.7,d:.15,r:150},{a:1.5,d:.15,r:165,wa:-1.2,ha:1.9}],tot:2.4,wa:-.6,ha:2.2},
 lunge:{c:'r',dmg:35,hits:[{a:.85,d:.5,r:60}],tot:1.9,wa:1.1,ha:1.57,dash:1},
 quake:{c:'r',dmg:25,hits:[],tot:2.1,wa:-.05,ha:2.75,wave:1.05},
 rage:{c:'w',dmg:20,hits:[{a:.6,d:.15,r:150},{a:1.05,d:.15,r:165},{a:1.9,d:.15,r:180}],tot:2.9,wa:-.6,ha:2.2},
 chop:{c:'w',dmg:18,hits:[{a:.45,d:.12,r:140}],tot:1.1,wa:-.3,ha:2.2},
 thrust:{c:'r',dmg:32,hits:[{a:.9,d:.18,r:270}],tot:1.9,wa:1.3,ha:1.57},
 spin:{c:'r',dmg:28,hits:[{a:1.0,d:.3,r:190,both:1}],tot:2.1,wa:-1.0,ha:2.2,spin:1},
 swords:{c:'r',dmg:18,hits:[],tot:3.6,cust:1},
 stampede:{c:'r',dmg:28,hits:[],tot:4.4,cust:1},
 dive:{c:'r',dmg:34,hits:[],tot:2.6,cust:1}
};
let st='title',P,B,fx,waves,shake=0,hs=0,flash=0,tm=0,msg=0,pop=0,swords=[],horses=[],slashes=[],rings=[],nums=[],ann=0,paused=false;
function reset(){
 P={x:800,y:G,vx:0,vy:0,f:1,hp:PMAX,sp:SMAX,spD:0,act:'',at:0,parry:0,bcd:0,blk:false,inv:0,hd:false,dead:false,dt:0,rf:1,air:false,sc:0};
 B={x:1600,f:-1,hp:1200,max:1200,post:0,postD:0,st:'intro',t:0,atk:null,an:'',at:0,hd:[],last:'',stag:0,ph:1,cd:1,wv:false,fy:0,cl:0,ca:0,hq:[],hv:0,bh:0,hx:0,hf:1,sk:0,fl:0,sw:0,hr:0,pw:0};
 fx=[];waves=[];swords=[];horses=[];slashes=[];rings=[];nums=[];shake=0;hs=0;msg=0;
}
function spark(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=80+Math.random()*260;fx.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-60,l:.4+Math.random()*.3,c})}}
function checkBoss(){
 if(B.st==='dead')return;
 if(B.hp<=0){B.hp=0;B.st='dead';B.t=0;B.atk=null;shake=16;snd(60,1,'sawtooth',.2);return}
 if(B.ph===2&&B.hp<=B.max*.33){B.ph=3;B.st='collapse';B.t=0;B.sk=0;B.atk=null;B.post=0;B.hx=B.x;B.hf=B.f;B.fy=0;B.sw=2;B.hr=4;B.pw=0;shake=18;snd(60,1.5,'sawtooth',.2);return}
 if(B.ph===1&&B.hp<=B.max*.66){B.ph=2;B.st='roar';B.t=0;B.atk=null;B.post=0;shake=16;snd(70,1.2,'sawtooth',.2)}
}
function addPost(n){
 if(['stag','roar','dead','intro','collapse'].includes(B.st))return;
 B.post+=n;B.postD=2.5;
 if(B.post>=100){B.st='stag';B.stag=3;B.atk=null;B.post=100;shake=12;hs=.15;flash=.2;snd(300,.4,'sawtooth',.15)}
}
function hurtP(c,dmg){
 if(P.inv>0||P.dead||(P.act==='roll'&&P.at<.28))return;
 const dir=P.x>B.x?1:-1;
 if(P.blk&&c==='w'){
  if(P.parry>0){hs=.14;shake=9;P.inv=.4;P.sp=SMAX;P.spD=0;pop=1;B.hp-=12;chg(12);checkBoss();addPost(35);spark(P.x+P.f*22,G-35,'#ffd76a',24);spark(P.x,G-40,'#5dff8a',18);rings.push({x:P.x+P.f*22,y:G-35,t:0,c:'#ffd76a',r:110});num(B.x,G-150,'PARRY','#ffd76a',24);snd(900,.15,'triangle',.14);flash=.12;return}
  P.sp-=30;P.spD=.8;P.hp-=dmg*.2;P.vx=dir*260;P.inv=.35;shake=4;spark(P.x+P.f*20,G-35,'#9cf',10);snd(200,.1);
  if(P.sp<=0){P.sp=0;P.blk=false;P.act='hit';P.at=0}
  if(P.hp<=0){P.hp=0;P.dead=true}
  return;
 }
 num(P.x,G-95,Math.round(dmg),'#ff6a6a');P.hp-=dmg;P.act='hit';P.at=0;P.blk=false;P.vx=dir*300;P.vy=-200;P.inv=1;shake=12;hs=.07;spark(P.x,G-35,'#c22',18);snd(90,.25,'sawtooth',.16);
 if(P.hp<=0){P.hp=0;P.dead=true}
}
function playerUpdate(dt){
 if(P.dead){P.dt+=dt;if(P.dt>1.8)st='lose';P.vy+=1800*dt;P.y=Math.min(G,P.y+P.vy*dt);return}
 P.inv-=dt;P.parry-=dt;P.bcd-=dt;P.spD-=dt;
 const busy=P.act!=='',gnd=P.y>=G,mv=(k('KeyD','ArrowRight')?1:0)-(k('KeyA','ArrowLeft')?1:0);
 if(P.spD<=0&&!P.blk)P.sp=Math.min(SMAX,P.sp+42*dt);
 if(P.blk&&!keys.KeyF)P.blk=false;
 if(!busy&&gnd&&pr('KeyF')&&P.bcd<=0){P.blk=true;P.parry=.2;P.bcd=.6}
 if(!busy&&!P.blk){
  if(pr('KeyE')&&P.sc>=B.max*.3&&gnd){P.act='super';P.at=0;P.sc=0;P.sl=0;P.inv=1.1;P.vx=0;snd(300,.5,'sine',.1)}
  else if(pr('Space')&&P.sp>=15){P.act='atk';P.at=0;P.hd=false;P.sp-=15;P.spD=.5;snd(300,.08,'square',.05)}
  else if(pr('KeyQ')&&gnd&&P.sp>=25){P.act='roll';P.at=0;P.rf=mv||P.f;puff(P.x,8);P.sp-=25;P.spD=.6;snd(180,.1,'triangle',.06)}
  else if(pr('KeyW','ArrowUp')&&gnd){P.vy=-640;puff(P.x,6)}
 }
 if(P.act===''||P.act==='atk'){
  const s=P.blk?80:230*(P.act==='atk'?.35:1);
  if(gnd||P.act===''){P.vx=mv*s}
  if(mv&&P.act===''&&!P.blk)P.f=mv;
 }
 if(P.act==='roll'){P.f=P.rf;P.vx=P.rf*(560-P.at*700)}
 if(P.act==='atk'&&P.at>.08&&P.at<.2&&!P.hd&&!['intro','dead','collapse'].includes(B.st)){
  const lo=Math.min(P.x,P.x+P.f*90),hi=Math.max(P.x,P.x+P.f*90);
  if(lo<B.x+45&&hi>B.x-45&&P.y-70<G-B.fy&&P.y>G-B.fy-135){
   P.hd=true;{const dm=B.st==='stag'?28:10;B.hp-=dm;chg(dm);num(B.x+(Math.random()-.5)*30,G-B.fy-150,dm,B.st==='stag'?'#ffb030':'#fff',B.st==='stag'?28:20)}spark(B.x-B.f*0+(P.x<B.x?-40:40),G-70,'#fff',8);hs=.05;shake=3;snd(240,.07,'square',.07);
   checkBoss();addPost(8);
  }
 }
 if(P.act==='super'){
  if(P.at<.55&&Math.random()<.9){const an=Math.random()*6.28,r=90;fx.push({x:P.x+Math.cos(an)*r,y:G-40+Math.sin(an)*r*.7,vx:-Math.cos(an)*r*2.8,vy:-Math.sin(an)*r*2,g:0,l:.32,c:'#bff6ff'})}
  if(P.at>=.55&&!P.sl){P.sl=1;slashes.push({x:P.x+P.f*30,f:P.f,vx:P.f*1700,t:0,hit:0});shake=18;flash=.3;ann=1.2;snd(110,.6,'sawtooth',.2);snd(1100,.3,'triangle',.1);spark(P.x,G-40,'#bff6ff',40);rings.push({x:P.x,y:G-40,t:0,c:'#bff6ff',r:130})}
 }
 if(P.act){P.at+=dt;const dur={atk:.32,roll:.5,hit:.3,super:1}[P.act];if(P.at>dur){P.act=''}}
 P.vy+=1800*dt;P.y+=P.vy*dt;if(P.y>=G){if(P.air&&P.vy>250)puff(P.x,12);P.y=G;P.vy=0;P.air=false}else P.air=true;
 if(P.y>=G&&Math.abs(P.vx)>150&&Math.random()<dt*16)fx.push({x:P.x-P.f*8,y:G-3,vx:-P.vx*.15,vy:-40,l:.3,c:'#8a7d6e'});
 P.x=cl(P.x+P.vx*dt,20,WW-20);
}
function chg(n){P.sc=Math.min(B.max*.3,P.sc+n);B.fl=.09}
function num(x,y,v,c,sz){nums.push({x,y,v,c,sz:sz||22,t:0})}
function camX(){return cl(P.x-W/2,0,WW-W)}
function flit(){const sd=Math.random()<.5?-1:1;B.fx0=B.x;B.tx=cl(P.x+sd*(200+Math.random()*160),120,WW-120);B.fy0=B.fy;B.ty=110+Math.random()*60;B.st='flit';B.t=0;spark(B.x,G-B.fy-60,'#7fe9ff',14);snd(520,.2,'sine',.06)}
function cust(a,dt){
 const t=B.at,n=B.an,e=1-Math.exp(-6*dt);
 if(n==='swords'){B.cl=-.2;B.ca=-.15;B.fy=lerp(B.fy,185,e);
  if(!B.sk&&t>=.5){B.sk=1;for(let i=0;i<5;i++)swords.push({ox:(i-2)*38,oy:-Math.abs(i-2)*14,x:B.x,y:G-B.fy-135,t:0,w:.9+i*.34,hov:1,c:i%2?'w':'r',a:0,vx:0,vy:0})}}
 else if(n==='stampede'){B.cl=-.25;B.ca=-.1;B.fy=lerp(B.fy,150,e);
  if(!B.sk){B.sk=1;B.hq=[{t:1,s:1},{t:1.8,s:-1},{t:2.5,s:1},{t:3,s:-1}]}
  for(const q of B.hq)if(!q.d&&t>=q.t){q.d=1;const cx=camX();horses.push({x:q.s>0?cx-120:cx+W+120,v:q.s*560,ph:Math.random()*6,l:6});snd(120,.3,'sawtooth',.12);shake=Math.max(shake,6)}}
 else if(n==='dive'){
  if(t<.9){B.fy=lerp(B.fy,175,e);B.cl=-.3;B.ca=-.2;B.f=P.x>B.x?1:-1;B.tx=P.x;B.sk=0;B.dh=0;B.dl=0}
  else if(t<1.35){if(!B.sk){B.sk=1;B.sx0=B.x}const u=(t-.9)/.45;B.x=lerp(B.sx0,B.tx,u);B.fy=lerp(175,0,u*u);B.cl=.7;B.ca=2.2;
   if(!B.dh&&!P.dead&&Math.abs(P.x-B.x)<60&&P.y-60<G-B.fy&&P.y>G-B.fy-135){B.dh=1;hurtP('r',a.dmg)}}
  else{if(!B.dl){B.dl=1;shake=10;spark(B.x,G-4,'#7fe9ff',20)}B.fy=lerp(B.fy,6,.2);B.cl=.2;B.ca=2.2}}
}
function bossUpdate(dt){
 B.t+=dt;
 if(B.st==='dead'){B.fy=lerp(B.fy,0,.1);if(B.t>2.2)st='win';return}
 if(B.st==='intro'){if(B.t>3)B.st='idle',B.t=0;return}
 if(B.ph===3&&B.st!=='collapse'&&B.st!=='flit'&&!(B.st==='atk'&&B.atk.cust))B.fy=lerp(B.fy,B.st==='stag'?0:B.st==='atk'?14:70+Math.sin(tm*3)*14,1-Math.exp(-7*dt));
 B.postD-=dt;if(B.postD<=0&&B.st!=='stag')B.post=Math.max(0,B.post-12*dt);
 if(B.ph===3&&!['collapse','stag','dead','roar'].includes(B.st)&&!P.dead){
  B.sw-=dt;B.hr-=dt;
  if(B.sw<=0){B.sw=2.8+Math.random();swords.push({ox:(Math.random()-.5)*120,oy:-20,x:B.x,y:G-B.fy-135,t:0,w:.9,hov:1,c:'w',hm:1,sp:430,a:0,vx:0,vy:0})}
  if(B.hr<.9&&!B.pw)B.pw=Math.random()<.5?1:-1;
  if(B.hr<=0){const cx=camX();horses.push({x:B.pw>0?cx-120:cx+W+120,v:B.pw*560,ph:Math.random()*6,l:6});snd(120,.3,'sawtooth',.12);shake=Math.max(shake,5);B.pw=0;B.hr=5.5+Math.random()*2}
 }
 if(B.st==='collapse'){B.hp=lerp(B.hp,B.max*.45,dt*1.5);B.fy=lerp(0,70,cl((B.t-1.3)/1.8));
  if(B.t>1.8&&!B.sk){B.sk=1;shake=14;spark(B.x,G-6,'#d8c7a8',30);snd(80,.5,'sawtooth',.2)}
  if(B.t>1.3&&B.t<3&&Math.random()<.6)fx.push({x:B.x+(Math.random()-.5)*70,y:G-30-Math.random()*70,vx:0,vy:-160,l:.9,c:'#7fe9ff'});
  if(B.t>3.6){B.st='idle';B.t=0;B.cd=1}return}
 if(B.st==='hop'){const u=cl(B.t/.55);B.x=cl(B.x+B.hv*(1-u)*dt*1.6,80,WW-80);if(B.t>.55){B.st='idle';B.t=0;B.cd=.15;spark(B.x,G-4,'#bfae95',12)}return}
 if(B.st==='flit'){const u=cl(B.t/.7);B.x=lerp(B.fx0,B.tx,u*u*(3-2*u));B.fy=lerp(B.fy0,B.ty,Math.min(1,u*2));if(u>=1){B.st='idle';B.t=0;B.cd=.2}return}
 if(B.st==='roar'){if(B.t>1.5){B.st='idle';B.t=0;B.cd=.5}return}
 if(B.st==='stag'){B.stag-=dt;if(B.stag<=0){B.st='idle';B.t=0;B.post=0;B.cd=.6}return}
 const d=P.x-B.x,ad=Math.abs(d),sp=B.ph===3?1.4:B.ph===2?1.5:1;
 if(B.st==='idle'){
  B.f=d>0?1:-1;
  if(B.ph===2&&!P.dead&&(B.bh||(ad<120&&Math.random()<dt*1.1))){B.bh=0;B.st='hop';B.t=0;B.hv=-B.f*430;spark(B.x,G-4,'#bfae95',10);snd(200,.15,'triangle',.08);return}
  B.bh=0;
  if(B.ph===3&&ad<100&&!P.dead&&Math.random()<dt){flit();return}
  if(ad>110&&!P.dead){B.x+=B.f*95*sp*dt;if(B.ph<3&&Math.random()<dt*7)fx.push({x:B.x-B.f*20,y:G-3,vx:-B.f*40,vy:-50,l:.35,c:'#8a7d6e'})}
  B.cd-=dt;
  if(B.cd<=0&&!P.dead&&(ad<260||B.t>2.4)){
   let pool=ad>360?['lunge','quake','quake','thrust']:ad>200?['sweep','sweep','quake','quake','lunge','combo','thrust']:['slam','sweep','sweep','quake','combo','chop','spin'];
   if(B.ph===2&&ad<260)pool.push('rage','rage');
   if(B.ph===3)pool=ad>420?['dive','lunge','thrust']:ad>220?['dive','thrust','combo','sweep']:['slam','combo','chop','spin','sweep','rage','dive'];
   const o=pool.filter(n=>n!==B.last);const n=o[Math.floor(Math.random()*o.length)];
   B.last=n;B.an=n;B.atk=A[n];B.at=0;B.hd=[];B.wv=false;B.sk=0;B.st='atk';
  }
 }else if(B.st==='atk'){
  B.at+=dt*sp;const a=B.atk;if(a.cust)cust(a,dt);
  a.hits.forEach((h,i)=>{
   if(B.at>=h.a&&B.at<h.a+h.d){
    if(a.dash){B.x=cl(B.x+B.f*(P.dead?0:760)*dt,60,WW-60);spark(B.x-B.f*30,G-4,'#bfae95',2)}
    if(B.an==='sweep'||B.an==='spin')spark(B.x+(B.an==='spin'&&Math.random()<.5?-1:1)*B.f*(30+h.r*.8),G-4,'#ffb860',2);
    if(B.hd[i])return;
    let lo=Math.min(B.x+B.f*30,B.x+B.f*(30+h.r)),hi=Math.max(B.x+B.f*30,B.x+B.f*(30+h.r));if(h.both){lo=B.x-30-h.r;hi=B.x+30+h.r}
    if(hi>P.x-14&&lo<P.x+14&&(!h.low||P.y>G-28)){B.hd[i]=1;hurtP(a.c,a.dmg)}
    if(i===0||h.a>0)if(!a.dash&&B.at-h.a<dt*sp*1.5){shake=Math.max(shake,6);snd(110,.15,'sawtooth',.1);spark(B.x+B.f*(30+h.r*.85),G-4,'#d8c7a8',10)}
   }
  });
  if(a.wave&&B.at>=a.wave&&!B.wv){B.wv=true;waves.push({x:B.x+B.f*80,v:B.f*400,l:3});shake=15;spark(B.x+B.f*90,G-4,'#d8c7a8',28);flash=.06;snd(70,.3,'sawtooth',.15)}
  if(B.at>=a.tot){B.bh=(P.x-B.x)*B.f<-30;B.st='idle';B.t=0;B.cd=B.ph>1?.3:.5;if(B.ph===3&&Math.random()<.5)flit()}
 }
}
function update(dt){
 tm+=dt;
 if(hs>0){hs-=dt}else{playerUpdate(dt);bossUpdate(dt);
  for(const w of waves){w.x+=w.v*dt;w.l-=dt;if(Math.random()<.7)spark(w.x,G-6,'#ff6a4a',1);if(Math.abs(P.x-w.x)<24&&P.y>G-30&&!P.dead){hurtP('r',A.quake.dmg);if(P.inv>0.5)w.l=0}}
  waves=waves.filter(w=>w.l>0&&w.x>0&&w.x<WW);
  for(const s of swords){s.t+=dt;
